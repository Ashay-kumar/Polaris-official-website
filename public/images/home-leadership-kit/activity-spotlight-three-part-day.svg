<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="690" viewBox="0 0 760 690"><rect x="40" y="35" width="676" height="620" rx="25" fill="#FFF9AD" stroke="#19253D" stroke-opacity=".2" stroke-width="2"/><path d="M55 134 H691" stroke="#C8EE56" stroke-width="26" stroke-linecap="round"/><text x="85" y="110" fill="#19253D" font-family="Georgia,serif" font-weight="700" font-size="55">Three-part day</text><text x="85" y="185" fill="#19253D" font-family="Arial,sans-serif" font-size="26" font-weight="700">10 minutes, at dinner</text><text x="85" y="259" fill="#19253D" font-family="Arial,sans-serif" font-size="25">Ask your child to tell their day in:</text><circle cx="108" cy="319" r="23" fill="#E93C8D"/><text x="101" y="328" font-family="Arial,sans-serif" fill="white" font-size="23" font-weight="700">1</text><text x="154" y="328" font-family="Arial,sans-serif" fill="#19253D" font-size="29">A beginning</text><circle cx="108" cy="390" r="23" fill="#E93C8D"/><text x="101" y="399" font-family="Arial,sans-serif" fill="white" font-size="23" font-weight="700">2</text><text x="154" y="399" font-family="Arial,sans-serif" fill="#19253D" font-size="29">A middle</text><circle cx="108" cy="461" r="23" fill="#E93C8D"/><text x="101" y="470" font-family="Arial,sans-serif" fill="white" font-size="23" font-weight="700">3</text><text x="154" y="470" font-family="Arial,sans-serif" fill="#19253D" font-size="29">An end</text><text x="85" y="554" font-family="Arial,sans-serif" font-size="23" fill="#19253D">Then ask one curious follow-up question.</text><text x="85" y="593" font-family="Arial,sans-serif" font-size="21" fill="#19253D">Keep it light and enjoyable.</text></svg>