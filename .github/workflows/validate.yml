name: Validate Polaris static website
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:foundation
      - run: npm run check:content
      - run: node scripts/check-stage-03-assets.mjs
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium
      - name: Verify domain-root static preview in Chromium
        env:
          POLARIS_TEST_BROWSER: chromium
        run: |
          node scripts/serve-export.mjs &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node node_modules/@playwright/test/cli.js test --grep-invert "1024px|768px|320px"
